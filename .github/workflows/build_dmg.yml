name: Build macOS DMG

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python PyMuPDF
        run: pip install pymupdf

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable & Generate macOS Project
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      # --- STEP BARU YANG DITAMBAHKAN ---
      - name: Ad-Hoc Sign macOS App
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          echo "Signing app at: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
      # ----------------------------------

      - name: Install create-dmg tool
        run: brew install create-dmg

      - name: Create DMG File
        run: |
          mkdir -p build/dmg
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          
          create-dmg \
            --volname "$APP_NAME Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 200 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 600 190 \
            "build/dmg/$APP_NAME.dmg" \
            "$APP_PATH" || true

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG-Installer
          path: build/dmg/*.dmg

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0-latest' }}
          name: Release ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0-latest' }}
          files: build/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}