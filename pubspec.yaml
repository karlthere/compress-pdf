name: squeeze_pdf
description: "Help you compress PDF files quickly and easily"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # File System & Desktop Picker
  file_picker: ^8.1.4
  path: ^1.9.0

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - web/favicon.png
    - compress_engine.py
